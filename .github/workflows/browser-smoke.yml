name: IDE browser smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/requirements.txt
      - run: npm ci && npm run build:editor && git diff --exit-code -- vendor/
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-core
      - run: python -m playwright install --with-deps --only-shell chromium firefox
      - run: python tests/browser_smoke.py
